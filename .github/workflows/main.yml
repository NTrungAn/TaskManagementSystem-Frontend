name: Frontend CI/CD

on:
  push:
    branches:
      - feature/docker

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      - name: 2. Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: .    
          push: true
          tags: |
            nguyentrungan/taskmanagementsystem-frontend:latest
            nguyentrungan/taskmanagementsystem-frontend:v1.0

      # ==========================================
      # GIAI ĐOẠN ĐÍCH: DEPLOY (Triển khai lên Render)
      # ==========================================
      - name: 4. Trigger Render Deployment
        run: curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
